name: BANNA Documentary Render

on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: Storyboard JSON path
        required: false
        default: storyboard.manhattan.json
  push:
    paths:
      - 'storyboard.manhattan.json'
      - 'requirements.txt'
      - '.github/workflows/render.yml'
      - 'banna/manhattan_graphics.py'
      - 'banna/manhattan_vintage.py'
      - 'banna/free_photos.py'
      - 'banna/media_probe.py'
      - 'banna/pipeline.py'
      - 'banna/timing.py'
      - 'banna/vintage.py'
      - 'banna/images.py'
      - 'banna/titanic_graphics.py'
      - 'banna/sound.py'
      - 'banna/qc.py'
      - 'tests/test_titanic_graphics.py'
      - 'tests/test_manhattan_graphics.py'
      - 'tests/test_archival_storyboard.py'

permissions:
  contents: read

concurrency:
  group: banna-render-archival-photo-v3
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install BANNA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Setup portable FFmpeg
        run: |
          mkdir -p "$HOME/.local/bin"
          python - <<'PY'
          import imageio_ffmpeg, os
          from pathlib import Path
          source = Path(imageio_ffmpeg.get_ffmpeg_exe())
          target = Path.home() / ".local" / "bin" / "ffmpeg"
          target.unlink(missing_ok=True)
          target.symlink_to(source)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(target.parent) + "\n")
          PY
          "$HOME/.local/bin/ffmpeg" -version
      - name: Run BANNA unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate voice-over
        run: |
          if ! find . -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.m4a' \) | grep -q .; then
            echo "::error::No voice-over found in repository root."
            exit 1
          fi
      - name: Render BANNA documentary
        env:
          BANNA_IMAGE_GENERATION_ENABLED: "false"
          BANNA_IMAGE_PROVIDER: local
          BANNA_WIDTH: "1920"
          BANNA_HEIGHT: "1080"
          BANNA_FPS: "30"
        run: python main.py render --storyboard "${{ github.event.inputs.storyboard || 'storyboard.manhattan.json' }}"
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: BANNA-Manhattan-Project-1080p
          path: |
            output/BANNA_documentary_1080p.mp4
            output/BANNA_QC_contact_sheet.jpg
            output/BANNA_Photo_Assets_Contact_Sheet.jpg
            output/BANNA_QC_report.json
            output/BANNA_word_timing.json
            output/BANNA_sound_cues.json
            output/BANNA_voiceover_transcript.txt
            work/generated/*_map_grid.jpg
            work/generated/BANNA_photo_sources.json
          if-no-files-found: error
          retention-days: 7
