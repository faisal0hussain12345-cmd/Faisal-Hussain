name: BANNA Documentary Render

on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: Storyboard JSON path
        required: false
        default: storyboard.json

permissions:
  contents: read

concurrency:
  group: banna-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install BANNA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run BANNA unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate voice-over
        run: |
          if ! find . -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.m4a' \) | grep -q .; then
            echo "::error::No voice-over found in repository root."
            exit 1
          fi
      - name: Render BANNA documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BANNA_IMAGE_PROVIDER: gemini
          BANNA_WIDTH: "1920"
          BANNA_HEIGHT: "1080"
          BANNA_FPS: "30"
        run: python main.py render --storyboard "${{ github.event.inputs.storyboard || 'storyboard.example.json' }}"
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: BANNA-1080p-documentary
          path: |
            output/BANNA_documentary_1080p.mp4
            output/BANNA_QC_contact_sheet.jpg
            output/BANNA_QC_report.json
            output/BANNA_word_timing.json
          if-no-files-found: error
          retention-days: 7
