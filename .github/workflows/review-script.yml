name: BANNA Free Script Review

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: Repository path to UTF-8 narration script
        required: true
        default: script.txt
      model:
        description: Use openrouter/free or a model ending in :free
        required: false
        default: openrouter/free

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Review with OpenRouter free models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY under repository Actions secrets."
            exit 1
          fi
          python main.py review-script --input "${{ inputs.script_path }}" --output output/BANNA_script_review.md
      - name: Upload review
        uses: actions/upload-artifact@v4
        with:
          name: BANNA-Free-Script-Review
          path: output/BANNA_script_review.md
          if-no-files-found: error
          retention-days: 7
