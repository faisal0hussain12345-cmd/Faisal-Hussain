name: BANNA OpenAI Script Review

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: Repository path to a UTF-8 narration script
        required: true
        default: script.txt
      model:
        description: OpenAI model ID (default is the low-cost GPT-6 Luna)
        required: false
        default: gpt-6-luna

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install BANNA dependencies
        run: python -m pip install -r requirements.txt
      - name: Review narration with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY in repository Actions secrets."
            exit 1
          fi
          python main.py review-script --input "${{ inputs.script_path }}" --output output/BANNA_script_review.md
      - name: Upload reviewed script
        uses: actions/upload-artifact@v4
        with:
          name: BANNA-OpenAI-Script-Review
          path: output/BANNA_script_review.md
          if-no-files-found: error
          retention-days: 7
